<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Garden IoT</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .phone-card { background: white; width: 100%; max-width: 400px; border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        h2 { margin: 0 0 25px; color: #1e293b; font-size: 22px; }
        .circle { width: 170px; height: 170px; border-radius: 50%; border: 10px solid #22c55e; margin: 0 auto 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.3s; }
        .percent { font-size: 44px; font-weight: 800; color: #15803d; }
        .label { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .status-box { background: #f8fafc; padding: 18px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .status-title { font-size: 14px; color: #64748b; margin-bottom: 6px; }
        .status-value { font-size: 24px; font-weight: bold; color: #ef4444; }
        .status-on { color: #22c55e; }
    </style>
</head>
<body>
    <div class="phone-card">
        <h2>🌱 Giám Sát Tưới Cây</h2>
        <div class="circle" id="ring">
            <div class="percent" id="moisture">--%</div>
            <div class="label">Độ ẩm đất</div>
        </div>
        <div class="status-box">
            <div class="status-title">Trạng thái máy bơm</div>
            <div class="status-value" id="pump">ĐANG TẮT (OFF)</div>
        </div>
    </div>

    <script>
        // Thay bằng link Firebase của bạn (nhớ giữ đuôi /garden.json)
        const FIREBASE_URL = "https://tuoicaytudong-default-rtdb.asia-southeast1.firebasedatabase.app/garden.json";

        async function updateDashboard() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                
                if (data) {
                    // Cập nhật độ ẩm
                    document.getElementById("moisture").innerText = data.moisture + "%";
                    
                    // Đổi màu vòng tròn nếu đất khô (< 30%)
                    const ring = document.getElementById("ring");
                    ring.style.borderColor = data.moisture < 30 ? "#f59e0b" : "#22c55e";

                    // Cập nhật trạng thái bơm
                    const pumpEl = document.getElementById("pump");
                    if (data.pump === "ON") {
                        pumpEl.innerText = "ĐANG BƠM NƯỚC (ON)";
                        pumpEl.classList.add("status-on");
                    } else {
                        pumpEl.innerText = "ĐANG TẮT (OFF)";
                        pumpEl.classList.remove("status-on");
                    }
                }
            } catch (error) {
                console.error("Lỗi lấy dữ liệu:", error);
            }
        }

        // Tự động làm mới dữ liệu mỗi 2 giây
        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>
</html>
