<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Garden Control</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f4f8; margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { background: white; width: 100%; max-width: 420px; border-radius: 28px; padding: 24px 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #0f172a; font-size: 20px; }
        .badge { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        /* Vòng tròn độ ẩm */
        .gauge-box { text-align: center; margin: 15px 0 25px; }
        .circle { width: 165px; height: 165px; border-radius: 50%; border: 12px solid #22c55e; margin: 0 auto 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.4s ease; }
        .percent { font-size: 42px; font-weight: 800; color: #0f172a; }
        .soil-note { font-size: 14px; font-weight: 600; color: #16a34a; }

        /* Trạng thái bơm */
        .status-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .status-label { font-size: 14px; color: #64748b; }
        .status-pill { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 10px; background: #fee2e2; color: #dc2626; }
        .status-pill.active { background: #dcfce7; color: #16a34a; animation: pulse 1.5s infinite; }

        /* Nút điều khiển chính */
        .btn-control { width: 100%; border: none; border-radius: 18px; padding: 18px; font-size: 17px; font-weight: 700; color: white; background: linear-gradient(135deg, #0ea5e9, #2563eb); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-control:active { transform: scale(0.97); }
        .btn-control.stop { background: linear-gradient(135deg, #f97316, #dc2626); box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3); }
        .btn-control:disabled { opacity: 0.6; cursor: not-allowed; }

        .sub-note { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 8px; }

        /* Nhật ký phiên làm việc */
        .log-section { margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 16px; }
        .log-title { font-size: 13px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 10px; }
        .log-list { list-style: none; padding: 0; margin: 0; max-height: 130px; overflow-y: auto; font-size: 13px; color: #334155; }
        .log-list li { padding: 6px 0; border-bottom: 1px dashed #e2e8f0; display: flex; justify-content: space-between; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2>🌱 Vườn Thông Minh</h2>
            <span class="badge" id="conn-badge">● Trực tuyến</span>
        </div>

        <div class="gauge-box">
            <div class="circle" id="ring">
                <div class="percent" id="moisture">--%</div>
                <div style="font-size: 12px; color: #64748b;">ĐỘ ẨM ĐẤT</div>
            </div>
            <div class="soil-note" id="soil-text">Đang tải dữ liệu...</div>
        </div>

        <div class="status-card">
            <span class="status-label">Trạng thái máy bơm</span>
            <span class="status-pill" id="pump-pill">ĐANG TẮT</span>
        </div>

        <button class="btn-control" id="action-btn" onclick="toggleManualPump()">
            💧 TƯỚI NƯỚC NGAY
        </button>
        <div class="sub-note">Tự động ngắt an toàn sau 10 giây tưới thủ công</div>

        <div class="log-section">
            <div class="log-title">Nhật ký hoạt động</div>
            <ul class="log-list" id="log-list">
                <li><span>Hệ thống sẵn sàng</span><span style="color:#94a3b8">--:--</span></li>
            </ul>
        </div>
    </div>

    <script>
        // Thay bằng link Firebase của bạn (giữ đuôi /garden.json)
        const FIREBASE_URL = "https://tuoicaytudong-eafaa-default-rtdb.asia-southeast1.firebasedatabase.app/garden.json";
        
        let isManualActive = false;
        let lastPumpState = "OFF";

        function addLog(message) {
            const list = document.getElementById("log-list");
            const now = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const li = document.createElement("li");
            li.innerHTML = `<span>${message}</span><span style="color:#94a3b8">${now}</span>`;
            list.insertBefore(li, list.firstChild);
        }

        // Gửi lệnh bật/tắt bơm lên Firebase khi người dùng bấm nút
        async function toggleManualPump() {
            const btn = document.getElementById("action-btn");
            btn.disabled = true; // Khóa nút tạm 1s tránh bấm đúp liên tục
            
            const targetState = !isManualActive;
            try {
                await fetch(FIREBASE_URL, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ manual_pump: targetState })
                });
                isManualActive = targetState;
                updateButtonUI();
                addLog(targetState ? "📲 Bấm tưới thủ công" : "🛑 Bấm dừng tưới");
            } catch (err) {
                alert("Lỗi gửi lệnh tới Firebase!");
            }
            
            setTimeout(() => { btn.disabled = false; }, 1000);
        }

        function updateButtonUI() {
            const btn = document.getElementById("action-btn");
            if (isManualActive) {
                btn.innerHTML = "🛑 DỪNG TƯỚI NGAY";
                btn.classList.add("stop");
            } else {
                btn.innerHTML = "💧 TƯỚI NƯỚC NGAY";
                btn.classList.remove("stop");
            }
        }

        // Đọc dữ liệu liên tục từ Firebase
        async function syncFirebase() {
            try {
                const res = await fetch(FIREBASE_URL);
                const data = await res.json();
                if (!data) return;

                // 1. Cập nhật độ ẩm & màu sắc cảnh báo
                const m = data.moisture ?? 0;
                document.getElementById("moisture").innerText = m + "%";
                const ring = document.getElementById("ring");
                const soilText = document.getElementById("soil-text");

                if (m < 30) {
                    ring.style.borderColor = "#f59e0b";
                    soilText.style.color = "#d97706";
                    soilText.innerText = "⚠️ Đất đang khô (Dưới 30%)";
                } else if (m <= 75) {
                    ring.style.borderColor = "#22c55e";
                    soilText.style.color = "#16a34a";
                    soilText.innerText = "✅ Độ ẩm đất lý tưởng";
                } else {
                    ring.style.borderColor = "#3b82f6";
                    soilText.style.color = "#2563eb";
                    soilText.innerText = "💧 Đất đang rất ẩm";
                }

                // 2. Cập nhật trạng thái bơm thực tế từ ESP32
                const pill = document.getElementById("pump-pill");
                if (data.pump === "ON") {
                    pill.innerText = "ĐANG BƠM NƯỚC";
                    pill.classList.add("active");
                } else {
                    pill.innerText = "ĐANG TẮT";
                    pill.classList.remove("active");
                }

                // Ghi log tự động khi bơm đổi trạng thái
                if (data.pump !== lastPumpState) {
                    addLog(data.pump === "ON" ? "💦 Máy bơm BẬT" : "⏸️ Máy bơm TẮT");
                    lastPumpState = data.pump;
                }

                // 3. Đồng bộ lại trạng thái nút bấm (khi ESP32 tự ngắt sau 10s)
                if (typeof data.manual_pump === "boolean" && data.manual_pump !== isManualActive) {
                    isManualActive = data.manual_pump;
                    updateButtonUI();
                }

            } catch (e) {
                document.getElementById("conn-badge").innerText = "● Mất kết nối";
                document.getElementById("conn-badge").style.background = "#fee2e2";
                document.getElementById("conn-badge").style.color = "#dc2626";
            }
        }

        setInterval(syncFirebase, 1500);
        syncFirebase();
    </script>
</body>
</html>
